<details><summary>Welke maat percolator is het meest veelzijdig?</summary><p>Er is geen universeel meest veelzijdig formaat. De cup-aanduiding gebruikt kleine moka-porties, dus vergelijk de ml-inhoud met jouw normale zetvolume.</p></details>
<details><summary>Welke vergelijking moet ik eerst lezen als ik helemaal vastzit?</summary><p>Begin met de vergelijking die jouw grootste twijfel oplost: materiaal (Aluminium vs RVS), kookplaat (Inductie vs gas), of merk (Bialetti vs Alessi). Als je nog niet weet welk type of budget bij je past, start dan met de koopgids en kom daarna terug naar de specifieke vergelijkingen.</p></details>
<details><summary>Werkt een RVS percolator ook op gas?</summary><p>Ja. Niet automatisch. Controleer per model voor welke warmtebronnen het geschikt is; voor inductie zijn onder meer de magnetische bodem en diameter relevant.</p></details>
<details><summary>Welke percolator maakt de beste koffie?</summary><p>De koffie-uitkomst hangt sterk af van koffie, maling, water, warmte en zetmethode. Sommige modellen, zoals de Brikka, gebruiken een afwijkend ventielsysteem, maar dat maakt het resultaat nog geen espresso uit een espressomachine.</p></details>
<details><summary>Kan ik jullie om persoonlijk vergelijkingsadvies vragen?</summary><p>Ja. Als je twijfelt tussen twee of drie concrete modellen kun je ons een bericht sturen met jouw situatie (kookplaat, budget, huishouden, ervaring en prioriteiten). Op basis van de modelspecificaties en jouw situatie geven we een eerlijke aanbeveling met voor- en nadelen per optie en een duidelijke voorkeur.</p></details>

        mobileMenuToggle.classList.toggle('active');

// Mobile dropdown toggle
const dropdownToggles = document.querySelectorAll('.dropdown-toggle');
dropdownToggles.forEach(toggle => {
    toggle.addEventListener('click', (e) => {
        if (window.innerWidth <= 768) {
            e.preventDefault();
            const dropdownItem = toggle.closest('.nav-item.dropdown');
            dropdownItem.classList.toggle('active');
            const dropdownMenu = dropdownItem.querySelector('.dropdown-menu');
            dropdownMenu.classList.toggle('active');
        }
    });
});
