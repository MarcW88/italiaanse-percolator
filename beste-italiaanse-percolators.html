or de smaak niet per se: een Moka Express van rond de €25 kan net zo goede koffie maken als een designmodel van €90. Je betaalt vooral voor design, materiaal, afwerking en merkbeleving. Voor dagelijks gebruik biedt het middensegment van €30–50 de beste balans tussen prijs, kwaliteit en duurzaamheid.</div></details><details class="faq-item"><summary>Mag een percolator in de vaatwasser?</summary><div class="faq-answer">Aluminium percolators mogen niet in de vaatwasser: het oppervlak wordt dof, kan verkleuren en de smaak lijdt eronder. RVS‑modellen zijn soms officieel vaatwasser‑geschikt, maar wij raden handwas met warm water aan. Dit beschermt de pakking en verlengt de levensduur aanzienlijk.</div></details><details class="faq-item"><summary>Waarom is mijn percolator koffie slap of waterig?</summary><div class="faq-answer">De meest voorkomende oorzaken zijn: te grove maling, te weinig koffie in het filter, een half gevulde percolator of te laag vuur. Gebruik een mokka/espresso‑maling, vul het filter tot net onder de rand (niet aanstampen), vul de onderkant tot onder het veiligheidsventiel en gebruik middelhoog vuur tot de koffie volledig is doorgelopen.</div></details><details class="faq-item"><summary>Moet ik per se een Bialetti kopen?</summary><div class="faq-answer">Bialetti is het originele merk met 90+ jaar ervaring, daarom domineren ze onze top 10. Er zijn echter ook goede alternatieven zoals de <a href="#grosche-milano">Grosche Milano</a>. Vermijd extreem goedkope no‑name modellen: die scoren vaak slecht op veiligheid en levensduur.</div></details><details class="faq-item"><summary>Hoe weet ik wanneer de koffie klaar is?</summary><div class="faq-answer">Je hoort het typische pruttel‑ en sisgeluid langzaam wegvallen zodra de kamer bovenin vol is. De koffiestroom stopt en de percolator maakt een kort, scherp geluid. Zet het vuur dan direct uit om aanbranden en bittere smaken te voorkomen. Na een korte rusttijd is de koffie klaar om te schenken.</div></details></d
